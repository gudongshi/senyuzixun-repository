<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森宇集团·项目作战指挥大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 1920px;
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
            margin-bottom: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            height: 48px;
            width: auto;
            border-radius: 8px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #0047AB, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .datetime {
            font-size: 18px;
            color: #00f2ff;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        /* Main Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            min-height: calc(100vh - 120px);
        }

        /* Panels */
        .panel {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(0, 71, 171, 0.3);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #00f2ff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #0047AB, #00f2ff);
            border-radius: 2px;
        }

        /* Chart Containers */
        .chart-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .chart-box {
            height: 280px;
            width: 100%;
        }

        .chart-box-small {
            height: 220px;
            width: 100%;
        }

        /* Center Section - KPIs */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: linear-gradient(135deg, rgba(0, 71, 171, 0.3), rgba(0, 242, 255, 0.1));
            border: 1px solid rgba(0, 71, 171, 0.4);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 71, 171, 0.4);
        }

        .kpi-value {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(90deg, #00f2ff, #0047AB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .kpi-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* Risk Alert Bar */
        .risk-alert-bar {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 16px;
            overflow: hidden;
        }

        .risk-alert-title {
            font-size: 14px;
            color: #f87171;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .risk-scroll {
            overflow: hidden;
            position: relative;
        }

        .risk-track {
            display: flex;
            animation: scroll-left 20s linear infinite;
        }

        .risk-item {
            flex-shrink: 0;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 8px 16px;
            margin-right: 12px;
            font-size: 13px;
            color: #fca5a5;
            white-space: nowrap;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Right Section - Rankings */
        .ranking-list {
            list-style: none;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(0, 71, 171, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .ranking-item:hover {
            background: rgba(0, 71, 171, 0.4);
            transform: translateX(4px);
        }

        .ranking-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            margin-right: 12px;
        }

        .ranking-num.gold {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #fff;
        }

        .ranking-num.silver {
            background: linear-gradient(135deg, #94a3b8, #64748b);
            color: #fff;
        }

        .ranking-num.bronze {
            background: linear-gradient(135deg, #b45309, #78350f);
            color: #fff;
        }

        .ranking-num.normal {
            background: rgba(0, 71, 171, 0.6);
            color: #00f2ff;
        }

        .ranking-info {
            flex: 1;
        }

        .ranking-name {
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .ranking-score {
            font-size: 12px;
            color: #00f2ff;
            margin-top: 2px;
        }

        /* AI Diagnostic Panel */
        .ai-panel-overlay {
            position: fixed;
            top: 0;
            right: -600px;
            width: 600px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.98);
            border-left: 2px solid #00f2ff;
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -8px 0 32px rgba(0, 71, 171, 0.5);
        }

        .ai-panel-overlay.active {
            right: 0;
        }

        .ai-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
        }

        .ai-panel-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #00f2ff, #0047AB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ai-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(0, 242, 255, 0.3);
            background: transparent;
            color: #00f2ff;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .ai-close-btn:hover {
            background: rgba(0, 242, 255, 0.2);
            transform: rotate(90deg);
        }

        .ai-panel-content {
            padding: 24px;
        }

        .ai-section {
            margin-bottom: 24px;
        }

        .ai-section-title {
            font-size: 16px;
            font-weight: 600;
            color: #00f2ff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-section-title::before {
            content: '◆';
            color: #0047AB;
        }

        .ai-analysis-card {
            background: rgba(0, 71, 171, 0.2);
            border: 1px solid rgba(0, 71, 171, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .ai-analysis-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-analysis-item:last-child {
            border-bottom: none;
        }

        .ai-label {
            color: #94a3b8;
            font-size: 14px;
        }

        .ai-value {
            color: #e2e8f0;
            font-weight: 500;
            font-size: 14px;
        }

        .ai-value.warning {
            color: #fbbf24;
        }

        .ai-value.danger {
            color: #f87171;
        }

        .ai-value.success {
            color: #34d399;
        }

        .ai-progress-bar {
            height: 8px;
            background: rgba(0, 71, 171, 0.4);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .ai-progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }

        .ai-recommendation {
            background: rgba(0, 242, 255, 0.1);
            border-left: 3px solid #00f2ff;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: #bae6fd;
            line-height: 1.6;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 17, 32, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 71, 171, 0.3);
            border-top-color: #00f2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-section">
                <img src="https://dt-beebot-prod.oss-cn-zhangjiakou.aliyuncs.com/dingtalk_prod_media/20260511/14/22/34/468053ed-51e7-4f77-ab5b-f0c6e1cdd6ee/%E6%A3%AE%E5%AE%87logo-1.jpg" 
                     alt="森宇集团 Logo" 
                     class="logo"
                     onerror="this.style.display='none'">
                <span class="logo-text">森宇集团·项目作战指挥大屏</span>
            </div>
            <div class="datetime" id="datetime"></div>
        </header>

        <!-- Main Content -->
        <main class="main-grid">
            <!-- Left Panel - Project Overview -->
            <section class="panel">
                <h2 class="panel-title">项目全景</h2>
                
                <div class="chart-container">
                    <div id="revenueChart" class="chart-box"></div>
                </div>

                <div class="chart-container">
                    <div id="progressChart" class="chart-box-small"></div>
                </div>

                <div class="chart-container">
                    <div id="categoryChart" class="chart-box-small"></div>
                </div>
            </section>

            <!-- Center Panel - Core Metrics -->
            <section class="panel">
                <h2 class="panel-title">核心态势</h2>
                
                <div class="kpi-grid">
                    <div class="kpi-card" onclick="showAIPanel('进行中项目')">
                        <div class="kpi-value" id="kpi-ongoing">24</div>
                        <div class="kpi-label">进行中项目数</div>
                    </div>
                    <div class="kpi-card" onclick="showAIPanel('本月新增任务')">
                        <div class="kpi-value" id="kpi-new-tasks">156</div>
                        <div class="kpi-label">本月新增任务</div>
                    </div>
                    <div class="kpi-card" onclick="showAIPanel('整体风险指数')">
                        <div class="kpi-value" id="kpi-risk">23%</div>
                        <div class="kpi-label">整体风险指数</div>
                    </div>
                    <div class="kpi-card" onclick="showAIPanel('人员负荷率')">
                        <div class="kpi-value" id="kpi-load">78%</div>
                        <div class="kpi-label">人员负荷率</div>
                    </div>
                </div>

                <div class="chart-container" style="flex: 1;">
                    <div id="centralChart" class="chart-box" style="height: 380px;"></div>
                </div>

                <div class="risk-alert-bar">
                    <div class="risk-alert-title">
                        <span>⚠️</span> 实时风险预警
                    </div>
                    <div class="risk-scroll">
                        <div class="risk-track" id="riskTrack">
                            <div class="risk-item">🔴 智慧园区项目 - 进度延迟 15%</div>
                            <div class="risk-item">🟡 数字化转型项目 - 预算超支 8%</div>
                            <div class="risk-item">🔴 云平台迁移 - 关键人员离职</div>
                            <div class="risk-item">🟡 数据中台建设 - 需求变更频繁</div>
                            <div class="risk-item">🟢 移动端开发 - 正常推进</div>
                            <div class="risk-item">🔴 智慧园区项目 - 进度延迟 15%</div>
                            <div class="risk-item">🟡 数字化转型项目 - 预算超支 8%</div>
                            <div class="risk-item">🔴 云平台迁移 - 关键人员离职</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Panel - Task Efficiency -->
            <section class="panel">
                <h2 class="panel-title">任务效能</h2>
                
                <div class="chart-container">
                    <div id="heatmapChart" class="chart-box-small"></div>
                </div>

                <div class="chart-container">
                    <h3 style="font-size: 16px; color: #00f2ff; margin-bottom: 12px;">个人效能排行榜 TOP 5</h3>
                    <ul class="ranking-list" id="rankingList">
                    </ul>
                </div>

                <div class="chart-container">
                    <div id="gaugeChart" class="chart-box-small"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- AI Diagnostic Panel -->
    <div class="ai-panel-overlay" id="aiPanel">
        <div class="ai-panel-header">
            <h2 class="ai-panel-title">AI 深度诊断面板</h2>
            <button class="ai-close-btn" onclick="closeAIPanel()">×</button>
        </div>
        <div class="ai-panel-content" id="aiPanelContent">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // ==================== Mock Data ====================
        const mockData = {
            revenueDistribution: [
                { value: 35, name: '智慧园区' },
                { value: 28, name: '数字化转型' },
                { value: 22, name: '云平台建设' },
                { value: 10, name: '数据中台' },
                { value: 5, name: '其他' }
            ],
            projectProgress: [
                { name: '智慧园区一期', value: 85 },
                { name: '数字化转型', value: 62 },
                { name: '云平台迁移', value: 45 },
                { name: '数据中台', value: 78 },
                { name: '移动端开发', value: 92 }
            ],
            categoryStats: [
                { name: '进度', value: 85 },
                { name: '质量', value: 78 },
                { name: '成本', value: 92 },
                { name: '风险', value: 65 },
                { name: '资源', value: 88 }
            ],
            taskHeatmap: [
                { name: '开发任务', value: 45 },
                { name: '测试任务', value: 28 },
                { name: '设计任务', value: 18 },
                { name: '文档任务', value: 12 },
                { name: '会议任务', value: 22 },
                { name: '评审任务', value: 15 }
            ],
            rankings: [
                { name: '张伟', score: 98, completed: 45 },
                { name: '李娜', score: 95, completed: 42 },
                { name: '王强', score: 92, completed: 38 },
                { name: '刘芳', score: 89, completed: 36 },
                { name: '陈明', score: 87, completed: 34 }
            ],
            weeklyReport: 87.5,
            riskAlerts: [
                { level: 'high', project: '智慧园区项目', issue: '进度延迟 15%' },
                { level: 'medium', project: '数字化转型项目', issue: '预算超支 8%' },
                { level: 'high', project: '云平台迁移', issue: '关键人员离职' },
                { level: 'medium', project: '数据中台建设', issue: '需求变更频繁' }
            ]
        };

        // ==================== Chart Initialization ====================
        let charts = {};

        function initCharts() {
            // Revenue Distribution (Donut Chart)
            charts.revenue = echarts.init(document.getElementById('revenueChart'));
            charts.revenue.setOption({
                tooltip: { trigger: 'item' },
                legend: { 
                    orient: 'vertical', 
                    right: 10, 
                    top: 'center',
                    textStyle: { color: '#e2e8f0' }
                },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['35%', '50%'],
                    data: mockData.revenueDistribution,
                    label: { show: false },
                    itemStyle: {
                        borderRadius: 8,
                        borderColor: '#1e293b',
                        borderWidth: 2
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 20,
                            shadowColor: '#00f2ff'
                        }
                    }
                }]
            });

            // Project Progress (Horizontal Bar)
            charts.progress = echarts.init(document.getElementById('progressChart'));
            charts.progress.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '3%', containLabel: true },
                xAxis: {
                    type: 'value',
                    max: 100,
                    axisLabel: { color: '#94a3b8' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                yAxis: {
                    type: 'category',
                    data: mockData.projectProgress.map(item => item.name),
                    axisLabel: { color: '#e2e8f0' }
                },
                series: [{
                    type: 'bar',
                    data: mockData.projectProgress.map(item => item.value),
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            { offset: 0, color: '#0047AB' },
                            { offset: 1, color: '#00f2ff' }
                        ]),
                        borderRadius: [0, 4, 4, 0]
                    },
                    label: {
                        show: true,
                        position: 'right',
                        color: '#00f2ff',
                        formatter: '{c}%'
                    }
                }]
            });

            // Category Radar Chart
            charts.category = echarts.init(document.getElementById('categoryChart'));
            charts.category.setOption({
                radar: {
                    indicator: mockData.categoryStats.map(item => ({
                        name: item.name,
                        max: 100
                    })),
                    center: ['50%', '50%'],
                    radius: '65%',
                    axisName: { color: '#00f2ff' },
                    splitLine: { lineStyle: { color: 'rgba(0, 71, 171, 0.3)' } },
                    splitArea: { areaStyle: { color: ['rgba(0, 71, 171, 0.1)', 'rgba(0, 71, 171, 0.05)'] } }
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: mockData.categoryStats.map(item => item.value),
                        name: '项目综合评估'
                    }],
                    lineStyle: { color: '#00f2ff', width: 2 },
                    itemStyle: { color: '#00f2ff' },
                    areaStyle: {
                        color: new echarts.graphic.RadialGradient(0, 0, 1, [
                            { offset: 0, color: 'rgba(0, 242, 255, 0.5)' },
                            { offset: 1, color: 'rgba(0, 71, 171, 0.2)' }
                        ])
                    }
                }]
            });

            // Central Trend Chart
            charts.central = echarts.init(document.getElementById('centralChart'));
            const trendData = Array.from({ length: 12 }, (_, i) => i + 1);
            const trendValues = [65, 72, 68, 75, 82, 79, 85, 88, 84, 91, 87, 93];
            charts.central.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['项目完成数', '任务完成率'], textStyle: { color: '#e2e8f0' } },
                xAxis: {
                    type: 'category',
                    data: trendData.map(m => `${m}月`),
                    axisLabel: { color: '#94a3b8' }
                },
                yAxis: [
                    { type: 'value', name: '项目数', axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } } },
                    { type: 'value', name: '完成率', max: 100, axisLabel: { color: '#94a3b8', formatter: '{c}%' }, splitLine: { show: false } }
                ],
                series: [
                    {
                        name: '项目完成数',
                        type: 'bar',
                        data: trendValues.map(v => Math.floor(v / 3)),
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#00f2ff' },
                                { offset: 1, color: '#0047AB' }
                            ])
                        }
                    },
                    {
                        name: '任务完成率',
                        type: 'line',
                        yAxisIndex: 1,
                        data: trendValues,
                        smooth: true,
                        lineStyle: { color: '#00f2ff', width: 3 },
                        itemStyle: { color: '#00f2ff' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(0, 242, 255, 0.3)' },
                                { offset: 1, color: 'rgba(0, 242, 255, 0)' }
                            ])
                        }
                    }
                ]
            });

            // Task Heatmap (Treemap)
            charts.heatmap = echarts.init(document.getElementById('heatmapChart'));
            charts.heatmap.setOption({
                series: [{
                    type: 'treemap',
                    data: mockData.taskHeatmap,
                    leafItemStyle: {
                        borderColor: '#1e293b',
                        borderWidth: 2
                    },
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 1, [
                            { offset: 0, color: '#0047AB' },
                            { offset: 1, color: '#00f2ff' }
                        ])
                    },
                    label: {
                        color: '#fff',
                        formatter: '{b}\n{c}个'
                    }
                }]
            });

            // Weekly Report Gauge
            charts.gauge = echarts.init(document.getElementById('gaugeChart'));
            charts.gauge.setOption({
                series: [{
                    type: 'gauge',
                    startAngle: 180,
                    endAngle: 0,
                    min: 0,
                    max: 100,
                    splitNumber: 5,
                    itemStyle: { color: '#00f2ff' },
                    progress: {
                        show: true,
                        width: 18
                    },
                    pointer: { show: false },

                else if (index === 1) numClass = 'silver';
                else if (index === 2) numClass = 'bronze';

                return `
                    <li class="ranking-item" onclick="showAIPanel('${item.name}')">

                        <div class="ranking-info">

        // ==================== DateTime Update ====================
        function updateDateTime() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false
            };
            document.getElementById('datetime').textContent = now.toLocaleString('zh-CN', options);
        }

        // ==================== Auto Refresh Framework ====================
        let refreshInterval;

        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                console.log('Auto refreshing data...');
                simulateDataRefresh();
            }, 60000); // 60 seconds
        }

        function simulateDataRefresh() {
            // Show loading
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // Simulate API call delay
            setTimeout(() => {
                // In real implementation, fetch new data from API here
                // For demo, just update some random values
                
                // Update KPIs with slight variations
                const ongoingEl = document.getElementById('kpi-ongoing');
                const currentOngoing = parseInt(ongoingEl.textContent);
                ongoingEl.textContent = currentOngoing + Math.floor(Math.random() * 3) - 1;

                const riskEl = document.getElementById('kpi-risk');
                const currentRisk = parseInt(riskEl.textContent);
                riskEl.textContent = Math.max(0, Math.min(100, currentRisk + Math.floor(Math.random() * 5) - 2)) + '%';

                // Hide loading
                document.getElementById('loadingOverlay').style.display = 'none';
                
                console.log('Data refreshed successfully');
            }, 1500);
        }

        // ==================== Resize Handler ====================
        function handleResize() {
            Object.values(charts).forEach(chart => {
                if (chart) chart.resize();
            });
        }

        // ==================== Initialization ====================
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            renderRankings();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            startAutoRefresh();
            window.addEventListener('resize', handleResize);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            Object.values(charts).forEach(chart => {
                if (chart) chart.dispose();
            });
        });
    </script>
